<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Control+</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-[#0b0f19] text-gray-900 dark:text-white transition-all">

<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-white dark:bg-[#111827] shadow-lg p-6">
    <h1 class="text-xl font-bold mb-8">💰 Control+</h1>

    <nav class="space-y-4">
      <button class="block w-full text-left px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-800">Dashboard</button>
      <button class="block w-full text-left px-4 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800">Loans</button>
    </nav>

    <!-- Toggle -->
    <div class="mt-10">
      <button onclick="toggleTheme()" class="w-full px-4 py-2 bg-black text-white dark:bg-white dark:text-black rounded-lg">
        Toggle Theme
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-8 space-y-8">

    <!-- Header -->
    <div class="flex justify-between items-center">
      <h2 class="text-2xl font-semibold">March 2026</h2>
    </div>

    <!-- Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow">
        <p class="text-sm text-gray-500">Main Balance</p>
        <h3 class="text-2xl font-bold text-red-500">₹-200000</h3>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow">
        <p class="text-sm text-gray-500">Savings A</p>
        <h3 class="text-2xl font-bold text-green-500">₹0</h3>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow">
        <p class="text-sm text-gray-500">Savings B</p>
        <h3 class="text-2xl font-bold text-green-500">₹0</h3>
      </div>

    </div>

    <!-- Add Entry -->
    <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow space-y-4">
      <h3 class="text-lg font-semibold">Add Entry</h3>

      <div class="grid md:grid-cols-5 gap-4">
        <input type="number" placeholder="Amount" class="p-3 rounded-lg bg-gray-100 dark:bg-gray-800">

        <select class="p-3 rounded-lg bg-gray-100 dark:bg-gray-800">
          <option>Expense</option>
          <option>Income</option>
        </select>

        <select class="p-3 rounded-lg bg-gray-100 dark:bg-gray-800">
          <option>Food</option>
          <option>EMI</option>
        </select>

        <select class="p-3 rounded-lg bg-gray-100 dark:bg-gray-800">
          <option>Main</option>
          <option>Savings A</option>
        </select>

        <button class="bg-black text-white dark:bg-white dark:text-black rounded-lg">
          Save
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow">
        <p class="text-sm text-gray-500">Total Spent</p>
        <h3 class="text-xl font-bold">₹0</h3>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow">
        <p class="text-sm text-gray-500">Total Invested</p>
        <h3 class="text-xl font-bold">₹0</h3>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow">
        <p class="text-sm text-gray-500">EMI Paid</p>
        <h3 class="text-xl font-bold">₹0</h3>
      </div>

    </div>

    <!-- Entries Table -->
    <div class="p-6 rounded-2xl bg-white dark:bg-[#111827] shadow">
      <h3 class="text-lg font-semibold mb-4">Entries</h3>

      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-gray-500">
            <th class="pb-2">Amount</th>
            <th>Type</th>
            <th>Category</th>
            <th>Account</th>
          </tr>
        </thead>

        <tbody class="space-y-2">
          <tr class="border-t border-gray-200 dark:border-gray-700">
            <td class="py-2">₹25000</td>
            <td>Expense</td>
            <td>EMI</td>
            <td>Main</td>
          </tr>
        </tbody>

      </table>
    </div>

  </main>
</div>

<script>
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
}
</script>

</body>
</html>
